# 仓库自有的 pytest 口径（2026-10-01 立）。
#
# 为什么要有这个文件：「超时 / 测试目录 / 标记」只写在 CI 的 YAML 里，本地跑的就是另一把
# 尺子；更实际的问题是——没有它的时候 pytest 会一路向上找到 AstrBot 的 pyproject.toml 当
# rootdir/inifile（实测 rootdir = AstrBot 根，跑的是别人的配置）。
# 改动这里要连带看一眼：.github/workflows/ci.yml 的 pytest 步骤不写第二份参数。
[pytest]
testpaths = tests
addopts = -q --strict-markers
timeout = 120
