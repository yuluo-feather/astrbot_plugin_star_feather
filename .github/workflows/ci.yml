# 星羽塔罗 CI/CD：每次 push / PR 在 GitHub 侧过一遍 lint + 编译 + 测试；
# main 上再产一个市场可直接用的整包 zip 作为 Actions 产物。
#
# 口径分流（别在这里另写检查逻辑）：
#   - 发布红线（版本四件套一致、市场包体 ≤16MB）写在 tests/test_release_gates.py，
#     本地 pytest 与 CI 共用一把尺子——YAML 里再抄一套正则是第二处口径，早晚漂移；
#   - pytest 的参数（测试目录 / 超时 / 标记）收在仓库根 pytest.ini，这里不写第二份；
#   - 开发工具链（pytest / ruff / mypy）的版本钉在 requirements-dev.txt：本地与 CI
#     装的是同一份文件，这里不再自己列一遍包名；
#   - 私密昵称扫描不进这里：它是发布体检 preflight 的职责，且本文件自身也在扫描范围内。
#
# 兼容性矩阵（为什么是这些格，别照着抄数字）：
#   - 安全下限侧：requirements.txt 钉着 pillow>=13.0.0，13.0.0 是 12.3.0 已披露 CVE 的
#     修复版本；3.12 与 3.13 都精确钉 13.0.0，确认这一格真能装、真能跑；
#   - 上限侧：不钉，装上游最新 Pillow——新轮子先炸先知道；
#   - Windows 是 AstrBot 的主场：路径、文件锁、字体目录都跟 libc 不同源，只在 ubuntu
#     上绿不算绿。下限格只在 ubuntu 上钉：轮子是二进制构建差异，API 面与平台无关；
#   - 钉完当场复核装到的版本：pip 静默解析成别的版本，这一格就名不副实了。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 发布当前 metadata.yaml 的版本（v<version>），已存在则跳过
        type: boolean
        default: false

concurrency:
  # PR：同一 PR 的新推送取消旧的。
  # main / dispatch：按 commit 分组，每次推送独立运行。共享分组时 GitHub 只保留一个
  # 排队运行，后来的推送会替换掉排队中的那次版本升级；发版作业只看得到存活提交的
  # metadata.yaml，被替换掉的版本就永远没人检查。
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: lint & test (${{ matrix.os }} · py${{ matrix.python }} · ${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # PR 只跑 3 格；完整矩阵（含 3.13 三格）在 main 与手动触发时跑。
    # 不能写在 job 级 if 里：jobs.<id>.if 求值时 matrix 上下文还不存在，条件无效。
    strategy:
      fail-fast: false
      matrix: >-
        ${{ github.event_name == 'pull_request'
        && fromJSON('{"include":[
        {"os":"ubuntu-latest","python":"3.12","pillow":"","label":"最新 Pillow"},
        {"os":"windows-latest","python":"3.12","pillow":"","label":"最新 Pillow"},
        {"os":"ubuntu-latest","python":"3.12","pillow":"13.0.0","label":"Pillow 13.0.0 安全下限"}
        ]}')
        || fromJSON('{"include":[
        {"os":"ubuntu-latest","python":"3.12","pillow":"","label":"最新 Pillow"},
        {"os":"ubuntu-latest","python":"3.13","pillow":"","label":"最新 Pillow"},
        {"os":"windows-latest","python":"3.12","pillow":"","label":"最新 Pillow"},
        {"os":"windows-latest","python":"3.13","pillow":"","label":"最新 Pillow"},
        {"os":"ubuntu-latest","python":"3.12","pillow":"13.0.0","label":"Pillow 13.0.0 安全下限"},
        {"os":"ubuntu-latest","python":"3.13","pillow":"13.0.0","label":"Pillow 13.0.0 安全下限"}
        ]}') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          # 两份需求一次解析；开发工具链的版本只有一处真源（requirements-dev.txt）
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: 钉 Pillow 到安全下限
        if: matrix.pillow != ''
        env:
          WANT: ${{ matrix.pillow }}
        run: |
          python -m pip install "Pillow==${{ matrix.pillow }}"
          python -c "import os, PIL; want = os.environ['WANT']; assert PIL.__version__ == want, f'装到 {PIL.__version__}，不是 {want}——这一格就名不副实了'"
      - name: 版本快照（排障用）
        run: python -c "import sys, PIL; print('py', sys.version.split()[0], '| Pillow', PIL.__version__)"
      - name: 编译检查
        run: python -m compileall -q .
      - name: ruff
        run: python -m ruff check .
      # 参数都在 pytest.ini：本地同一条命令，尺子只有一把
      - name: pytest
        run: python -m pytest

  contract:
    # AstrBot 契约守卫：我们依赖的框架面（main.py 的导入 ∪ conftest 的桩名单）在真实
    # 框架里还活着吗。
    #
    # 拦不拦，按「这一格丢了会不会影响用户」分：
    #   - 运行版本（==4.29.4，运行目录正跑着的那一版）：必拦。它红了＝插件在用户手上
    #     跑不起来，这不是「先看看」的事；
    #   - 上游最新：只报不拦。上游挪了面先让我们看见，处置权在人手上，不挡合并；
    #   - 最低声明（==4.16.0，metadata.yaml 里 astrbot_version 的下限）：只报不拦。
    #     声明支持就得有证据——先让它自己跑出结论，再决定是收紧声明还是补实现。
    #
    # 容错写在矩阵格上（matrix.experimental），不是 job 级 continue-on-error：
    # job 级那句会把「运行版本」格的失败一起吞掉——承诺了必拦，实际一格都没拦。
    name: AstrBot 契约守卫 (${{ matrix.label }} · ${{ matrix.experimental && '只报不拦' || '必拦' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PR 上只跑必拦的「运行版本」格；两个只报不拦的实验格留到 main 与手动触发。
    # 同样不能写在 job 级 if 里（matrix 上下文不可用），改为按事件生成矩阵。
    strategy:
      fail-fast: false
      matrix: >-
        ${{ github.event_name == 'pull_request'
        && fromJSON('{"include":[
        {"label":"运行版本","spec":"==4.29.4","experimental":false}
        ]}')
        || fromJSON('{"include":[
        {"label":"运行版本","spec":"==4.29.4","experimental":false},
        {"label":"上游最新","spec":"","experimental":true},
        {"label":"最低声明 4.16","spec":"==4.16.0","experimental":true}
        ]}') }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: 装插件依赖与真框架
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt "astrbot${{ matrix.spec }}"
      - name: 框架自报版本
        run: python -c "import astrbot; print('astrbot', getattr(astrbot, '__version__', '?'))"
      - name: 契约检查
        run: python -m pytest tests/test_astrbot_contract.py -s

  static:
    # 静态类型检查。口径在仓库根 mypy.ini —— 跟 pytest.ini 一个道理，
    # 谁跑都是同一把尺子，参数的第二个副本迟早漂移。
    #
    # 必拦：存量 48 条已经清到 0，并连续多轮全绿；这一格现在挡合并。
    # 引擎升版本时若重新开口，先按新报告修到绿，不要把 continue-on-error 加回来。
    #
    # 钉住两样东西，都是为了让这一格的「红」有意义：
    #   - 引擎钉 mypy：版本写在 requirements-dev.txt（本地与 CI 同一把尺子，一处真源），
    #     mypy 换版本就会换报告，跟着浮动等于每周看一份新报告；
    #   - Pillow 钉 requirements.txt 声明的安全下限：这一格要查的是「我们对用户承诺的最低面」
    #     还成不成立，而不是上游今天换了什么存根。上限侧由 test 矩阵的最新格负责。
    # 不装 pyright：两个引擎会漂移，修好一个把另一个弄红，一个仓只养一把静态尺子。
    name: 静态类型 (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: 装依赖并钉住 Pillow 下限
        env:
          PILLOW_WANT: "13.0.0"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install "Pillow==$PILLOW_WANT"
      # 跟 test 矩阵的下限格同一个道理：pip 静默解析成别的版本，
      # 这一格就从「对最低面负责」变成「对今天碰巧装到的那版负责」了。
      # mypy 那侧不在这里抄一份版本号：钉值现读 requirements-dev.txt（单一真源）
      - name: 钉完当场复核
        env:
          PILLOW_WANT: "13.0.0"
        run: |
          python -c "import os, PIL; w = os.environ['PILLOW_WANT']; assert PIL.__version__ == w, f'Pillow 装到 {PIL.__version__}，不是 {w}——这一格就名不副实了'"
          python -c 'import re, mypy.version; want = re.search(r"^mypy==(\S+)", open("requirements-dev.txt", encoding="utf-8").read(), re.M).group(1); assert mypy.version.__version__ == want, "mypy 装到 %s，不是 %s（requirements-dev.txt 钉的那版）" % (mypy.version.__version__, want); print("mypy", want, "对齐 requirements-dev.txt")'
      - name: mypy
        run: python -m mypy

  smoke:
    name: 真框架启动冒烟（手动）
    # 这一格买的是单测桩买不到的东西：metadata 解析、目录扫描、真实 import、
    # @register 与 initialize 钩子是否仍被框架调用；横幅出现后再经 WebChat
    # 通道发一条 /占卜，验证命令链与发送。只在手动触发时跑，不进 PR 的必拦路径。
    # Windows 是 AstrBot 的主场（冷启动与路径语义）；Linux 那格负责优雅退出：
    # Windows 没有 SIGINT 语义，只能硬杀，core 的 terminate 钩子走不到。
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: 装插件依赖与真框架
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install "astrbot==4.29.4"
      - name: 真框架启动冒烟
        run: python scripts/smoke_startup_check.py

  package:
    name: 打包市场 zip
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: 读版本号
        id: version
        run: |
          set -euo pipefail
          version=$(awk '/^version:/{print $2; exit}' metadata.yaml)
          printf '%s' "$version" | grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+$' || {
            echo "::error::metadata.yaml 的 version 不是 X.Y.Z：$version"
            exit 1
          }
          echo "value=$version" >> "$GITHUB_OUTPUT"
      # 布局对齐 AstrBot 安装器真正拉的那份：core/repository.py 拼的
      # https://github.com/<owner>/<name>/archive/refs/heads/<branch>.zip → 顶层目录
      # astrbot_plugin_star_feather-main/。产物仅供人工下载/留档，不是市场投递物。
      - name: 打包（只含仓库已跟踪文件，等价市场拉取的 zip）
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=astrbot_plugin_star_feather-main/ -o "astrbot_plugin_star_feather-$VERSION.zip" HEAD
          ls -lh astrbot_plugin_star_feather-*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: astrbot_plugin_star_feather-${{ steps.version.outputs.value }}
          path: astrbot_plugin_star_feather-*.zip
          retention-days: 30

  release:
    name: 发布 Release（版本未发布时）
    # 该版本的 Release 不存在或缺 zip 时补齐，已完整则跳过——幂等，不依赖「本次推送是否
    # 改了版本号」。GitHub 并发组会替换排队中的运行，按推送区间判断会漏掉被替换的那次
    # 版本升级；按 Release 状态判断则任何一次后续运行都能补上。手动触发需勾选 release 且在 main。
    needs: [test, contract, static]
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch'
          && github.event.inputs.release == 'true'
          && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      # 按 commit 分组：固定组只保留一个排队作业，后来的版本升级会把排队中的替换掉。
      # 不同版本的发布互不依赖；同一版本的并发创建由发布步骤的兜底处理。
      group: release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: 校验版本与发布说明
        id: version
        env:
          # 从这个版本起才开始发 Release；更早的版本没有历史 release，不补发。
          MIN_RELEASE_VERSION: "0.9.0"
        run: |
          set -euo pipefail
          version=$(awk '/^version:/{print $2; exit}' metadata.yaml)
          code=$(grep -m1 '^VERSION = "' main.py | cut -d'"' -f2)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+$'; then
            echo "::error::metadata.yaml 的 version 不是 X.Y.Z：$version"
            exit 1
          fi
          test "$code" = "$version"
          test -f "changelogs/v$version.md"
          lowest=$({ echo "$MIN_RELEASE_VERSION"; echo "$version"; } | sort -V | head -1)
          if [ "$lowest" != "$MIN_RELEASE_VERSION" ]; then
            echo "allow=false" >> "$GITHUB_OUTPUT"
            echo "::notice::版本 $version 早于起始发布版本 $MIN_RELEASE_VERSION，跳过"
            exit 0
          fi
          echo "allow=true" >> "$GITHUB_OUTPUT"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: 检查 Release 与 tag 状态
        id: state
        if: steps.version.outputs.allow == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zip="astrbot_plugin_star_feather-$VERSION.zip"
          tag=false
          tag_sha=""
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            tag=true
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$VERSION" --jq .sha)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"
          # 产物必须来自 tag 指向的提交；没有 tag 时才用本轮 SHA（发布时由我们打 tag）。
          source=$SHA
          if [ "$tag" = "true" ]; then source=$tag_sha; fi
          echo "source_sha=$source" >> "$GITHUB_OUTPUT"
          if ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          draft=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          asset=false
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "$zip"; then
            asset=true
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          # 只有「已发布且带 zip」才算完整；草稿或缺资产都要继续修复。
          if [ "$draft" != "true" ] && [ "$asset" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 打包市场 zip
        if: steps.state.outputs.skip == 'false' && (steps.state.outputs.release != 'true' || steps.state.outputs.asset != 'true')
        env:
          VERSION: ${{ steps.version.outputs.value }}
          TAG: ${{ steps.state.outputs.tag }}
          SOURCE_SHA: ${{ steps.state.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [ "$TAG" = "true" ]; then
            git fetch --depth=1 origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
            git archive --format=zip --prefix=astrbot_plugin_star_feather-main/ -o "astrbot_plugin_star_feather-$VERSION.zip" "v$VERSION"
          else
            git archive --format=zip --prefix=astrbot_plugin_star_feather-main/ -o "astrbot_plugin_star_feather-$VERSION.zip" "$SOURCE_SHA"
          fi
          ls -lh astrbot_plugin_star_feather-*.zip
      - name: 创建或补齐 Release
        if: steps.state.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          RELEASE_EXISTS: ${{ steps.state.outputs.release }}
          RELEASE_DRAFT: ${{ steps.state.outputs.draft }}
          RELEASE_ASSET: ${{ steps.state.outputs.asset }}
          TAG: ${{ steps.state.outputs.tag }}
          SOURCE_SHA: ${{ steps.state.outputs.source_sha }}
        run: |
          set -euo pipefail
          zip="astrbot_plugin_star_feather-$VERSION.zip"
          if [ "$RELEASE_EXISTS" = "true" ]; then
            # 资产已存在（草稿）：只发布，不重新上传；资产缺失：用 tag 指向的提交重建后补上。
            if [ "$RELEASE_ASSET" != "true" ]; then
              gh release upload "v$VERSION" "$zip" --repo "$GITHUB_REPOSITORY" --clobber
            fi
            if [ "$RELEASE_DRAFT" = "true" ]; then
              gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
            fi
            exit 0
          fi
          if [ "$TAG" = "true" ]; then
            if gh release create "v$VERSION" "$zip" --repo "$GITHUB_REPOSITORY" --verify-tag --title "v$VERSION" --notes-file "changelogs/v$VERSION.md"; then
              exit 0
            fi
          else
            if gh release create "v$VERSION" "$zip" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "changelogs/v$VERSION.md"; then
              exit 0
            fi
          fi
          # 并发：另一个运行刚建好 Release。只有 tag 指向本轮打包的提交才补资产。
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$VERSION" --jq .sha)
          if [ "$tag_sha" != "$SOURCE_SHA" ]; then
            echo "::notice::v$VERSION 已由提交 $tag_sha 创建，本次不覆盖资产"
            exit 0
          fi
          gh release upload "v$VERSION" "$zip" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
