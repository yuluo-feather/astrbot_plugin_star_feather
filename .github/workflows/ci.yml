# 星羽塔罗 CI/CD：每次 push / PR 在 GitHub 侧过一遍 lint + 编译 + 测试；
# main 上再产一个市场可直接用的整包 zip 作为 Actions 产物。
#
# 口径分流（别在这里另写检查逻辑）：
#   - 发布红线（版本四件套一致、市场包体 ≤16MB）写在 tests/test_release_gates.py，
#     本地 pytest 与 CI 共用一把尺子——YAML 里再抄一套正则是第二处口径，早晚漂移；
#   - pytest 的参数（测试目录 / 超时 / 标记）收在仓库根 pytest.ini，这里不写第二份；
#   - 私密昵称扫描不进这里：它是发布体检 preflight 的职责，且本文件自身也在扫描范围内。
#
# 兼容性矩阵（为什么是这些格，别照着抄数字）：
#   - 下限侧：requirements.txt 钉着 pillow>=10.0.0，那 10.0.0 就是对用户许的最低承诺，
#     必须真跑一遍。py3.12 精确钉 10.0.0；py3.13 上 Pillow 的实际下限是 11.0.0
#     （10.x 没有 cp313 轮子，钉 10.0.0 根本装不上），所以 3.13 格钉 11.0.0；
#   - 上限侧：不钉，装上游最新 Pillow——新轮子先炸先知道；
#   - Windows 是 AstrBot 的主场：路径、文件锁、字体目录都跟 libc 不同源，只在 ubuntu
#     上绿不算绿。下限格只在 ubuntu 上钉：轮子是二进制构建差异，API 面与平台无关；
#   - 钉完当场复核装到的版本：pip 静默解析成别的版本，这一格就名不副实了。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint & test (${{ matrix.os }} · py${{ matrix.python }} · ${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # 上限侧：三个平台/解释器组合都跟着上游最新 Pillow 跑
          - os: ubuntu-latest
            python: "3.12"
            pillow: ""
            label: 最新 Pillow
          - os: ubuntu-latest
            python: "3.13"
            pillow: ""
            label: 最新 Pillow
          - os: windows-latest
            python: "3.12"
            pillow: ""
            label: 最新 Pillow
          - os: windows-latest
            python: "3.13"
            pillow: ""
            label: 最新 Pillow
          # 下限侧：声明的底线，精确钉住
          - os: ubuntu-latest
            python: "3.12"
            pillow: "10.0.0"
            label: Pillow 10.0.0 下限
          - os: ubuntu-latest
            python: "3.13"
            pillow: "11.0.0"
            label: Pillow 11.0.0 下限
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-timeout ruff
      - name: 钉 Pillow 到声明下限
        if: matrix.pillow != ''
        env:
          WANT: ${{ matrix.pillow }}
        run: |
          python -m pip install "Pillow==${{ matrix.pillow }}"
          python -c "import os, PIL; want = os.environ['WANT']; assert PIL.__version__ == want, f'装到 {PIL.__version__}，不是 {want}——这一格就名不副实了'"
      - name: 版本快照（排障用）
        run: python -c "import sys, PIL; print('py', sys.version.split()[0], '| Pillow', PIL.__version__)"
      - name: 编译检查
        run: python -m compileall -q .
      - name: ruff
        run: python -m ruff check .
      # 参数都在 pytest.ini：本地同一条命令，尺子只有一把
      - name: pytest
        run: python -m pytest

  contract:
    # AstrBot 契约守卫：我们依赖的框架面（main.py 的导入 ∪ conftest 的桩名单）在真实
    # 框架里还活着吗。只报不拦——上游挪了面先让我们看见，不挡合并；红了的处置权在人手上。
    name: AstrBot 契约守卫 (${{ matrix.label }} · 只报不拦)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 运行版本
            spec: "==4.28.1" # 运行目录正跑着的那一版
          - label: 上游最新
            spec: "" # 上游最新稳定版：先知道它动了我们哪一面
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 装插件依赖与真框架
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-timeout "astrbot${{ matrix.spec }}"
      - name: 框架自报版本
        run: python -c "import astrbot; print('astrbot', getattr(astrbot, '__version__', '?'))"
      - name: 契约检查
        run: python -m pytest tests/test_astrbot_contract.py -s

  static:
    # 静态类型检查。口径在仓库根 mypy.ini —— 跟 pytest.ini 一个道理，
    # 谁跑都是同一把尺子，参数的第二个副本迟早漂移。
    #
    # 只报不拦：job 级 continue-on-error。存量 48 条已经清到 0，但引擎升一次版本就会重新开口，
    # 先让它自己站一段时间证明不出假红，再决定要不要翻成真拦。翻了才挡合并，现在不挡。
    #
    # 钉住两样东西，都是为了让这一格的「红」有意义：
    #   - 引擎钉 mypy==X：mypy 换版本就会换报告，跟着浮动等于每周看一份新报告；
    #   - Pillow 钉 requirements.txt 声明的下限：这一格要查的是「我们对用户承诺的最低面」
    #     还成不成立，而不是上游今天换了什么存根。上限侧由 test 矩阵的最新格负责。
    # 不装 pyright：两个引擎会漂移，修好一个把另一个弄红，一个仓只养一把静态尺子。
    name: 静态类型 (mypy · 只报不拦)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 装依赖并钉住引擎与 Pillow
        env:
          PILLOW_WANT: "10.0.0"
          MYPY_WANT: "2.3.1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "Pillow==$PILLOW_WANT" "mypy==$MYPY_WANT"
      # 跟 test 矩阵的下限格同一个道理：pip 静默解析成别的版本，
      # 这一格就从「对最低面负责」变成「对今天碰巧装到的那版负责」了。
      - name: 钉完当场复核
        env:
          PILLOW_WANT: "10.0.0"
          MYPY_WANT: "2.3.1"
        run: |
          python -c "import os, PIL; w = os.environ['PILLOW_WANT']; assert PIL.__version__ == w, f'Pillow 装到 {PIL.__version__}，不是 {w}——这一格就名不副实了'"
          python -c "import os, mypy.version; w = os.environ['MYPY_WANT']; assert mypy.version.__version__ == w, f'mypy 装到 {mypy.version.__version__}，不是 {w}——尺子换了要说出来'"
      - name: mypy
        run: python -m mypy

  package:
    name: 打包市场 zip
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: 读版本号
        id: version
        run: |
          echo "value=$(sed -n 's/^version: *//p' metadata.yaml | head -1)" >> "$GITHUB_OUTPUT"
      # 布局对齐 AstrBot 安装器真正拉的那份：core/repository.py 拼的
      # https://github.com/<owner>/<name>/archive/refs/heads/<branch>.zip → 顶层目录
      # astrbot_plugin_star_feather-main/。产物仅供人工下载/留档，不是市场投递物。
      - name: 打包（只含仓库已跟踪文件，等价市场拉取的 zip）
        run: |
          git archive --format=zip --prefix=astrbot_plugin_star_feather-main/ \
            -o "astrbot_plugin_star_feather-${{ steps.version.outputs.value }}.zip" HEAD
          ls -lh astrbot_plugin_star_feather-*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: astrbot_plugin_star_feather-${{ steps.version.outputs.value }}
          path: astrbot_plugin_star_feather-*.zip
          retention-days: 30
