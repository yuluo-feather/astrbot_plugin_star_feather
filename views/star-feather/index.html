<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>星羽塔罗 · 观测台</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="sky-hue">
      <div class="sky-nebula"></div>
      <div id="sky-stars" class="sky-stars"></div>
    </div>
    <canvas id="meteor-canvas" class="meteor-canvas"></canvas>
    <div class="water">
      <div class="water-hue">
        <div class="water-inner">
          <div class="sky-nebula water-nebula"></div>
          <div id="water-stars" class="sky-stars"></div>
        </div>
      </div>
      <div id="water-meteors" class="water-meteors"></div>
      <canvas id="meteor-water" class="meteor-canvas meteor-water"></canvas>
    </div>
    <canvas id="environment-canvas" class="environment-canvas"></canvas>
  </div>
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <filter id="water-ripple" x="-6%" y="-6%" width="112%" height="112%"
              color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.0028 0.012"
                      numOctaves="2" seed="7" result="noise">
          <animate attributeName="baseFrequency" dur="12s"
                   values="0.0026 0.010;0.0036 0.016;0.0026 0.010"
                   repeatCount="indefinite" />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="11"
                           xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"
             stroke-linecap="round" aria-hidden="true">
          <path d="M12 2.5v19M2.5 12h19M5.2 5.2l13.6 13.6M18.8 5.2L5.2 18.8" />
          <path d="M12 6.2l1.35 4.45L17.8 12l-4.45 1.35L12 17.8l-1.35-4.45L6.2 12l4.45-1.35z" />
        </svg>
      </span>
      <div>
        <h1 id="heading">星羽塔罗 · 观测台</h1>
        <p id="subtitle" class="sub">今日牌运与牌面，只读</p>
      </div>
    </div>
    <div class="top-right">
      <span id="version" class="pill"></span>
      <button id="refresh" class="ghost" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 12a8 8 0 1 1-2.34-5.66" />
          <path d="M20 4v6h-6" />
        </svg>
        <span>刷新</span>
      </button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="daily" type="button">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="5" width="16" height="15" rx="2" />
        <path d="M8 3v4M16 3v4M4 10h16" />
      </svg>
      <span>今日牌运</span>
    </button>
    <button class="tab" data-tab="cards" type="button">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="6" width="12" height="15" rx="2" />
        <path d="M8 6V4h12v15h-2" />
      </svg>
      <span>牌意图鉴</span>
    </button>
    <button class="tab" data-tab="spreads" type="button">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="4" width="7" height="7" rx="1.5" />
        <rect x="13" y="4" width="7" height="7" rx="1.5" />
        <rect x="4" y="13" width="7" height="7" rx="1.5" />
        <rect x="13" y="13" width="7" height="7" rx="1.5" />
      </svg>
      <span>牌阵介绍</span>
    </button>
    <button class="tab" data-tab="preview" type="button">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z" />
      </svg>
      <span>占卜预览</span>
    </button>
  </nav>

  <main>
    <section id="panel-daily" class="panel">
      <div id="stats" class="stats"></div>
      <p id="daily-note" class="hint hidden"></p>
      <div class="split">
        <aside class="list" id="daily-list" aria-label="今日用户"></aside>
        <article class="detail" id="daily-detail">
          <p class="empty">选择左侧的用户查看解读</p>
        </article>
      </div>
    </section>

    <section id="panel-cards" class="panel hidden">
      <div class="cards-toolbar">
        <label class="switch">
          <input type="checkbox" id="reversed" />
          <span>逆位预览</span>
        </label>
        <span class="hint">点牌面看牌义与关键词</span>
      </div>
      <div class="suit-filter" id="suit-filter"></div>
      <div class="card-grid" id="card-grid"></div>
    </section>

    <section id="panel-spreads" class="panel hidden">
      <div class="spread-grid" id="spread-grid"></div>
    </section>

    <section id="panel-preview" class="panel hidden">
      <div class="preview-form">
        <div class="preview-row">
          <label class="field">
            <span>牌阵</span>
            <select id="preview-spread"></select>
          </label>
          <label class="field field-grow">
            <span>问题（可留空）</span>
            <input id="preview-question" type="text" maxlength="200"
                   placeholder="想看看什么？" />
          </label>
          <button id="preview-draw" class="primary" type="button">抽牌</button>
        </div>
        <div class="preview-actions">
          <button id="preview-ai" class="ghost" type="button" disabled>AI 深度解读</button>
          <span id="preview-note" class="hint">预览不消耗次数、不写入缓存、不会发送到聊天</span>
        </div>
      </div>
      <div id="preview-result" class="preview-result">
        <p class="empty">选一个牌阵，抽一次牌。</p>
      </div>
    </section>
  </main>

  <div id="card-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-panel">
      <button id="card-modal-close" class="modal-close" type="button" aria-label="关闭">×</button>
      <div class="card-modal-head">
        <img id="card-modal-img" class="thumb card-modal-img" alt="" />
        <div class="card-modal-info">
          <h2 id="card-modal-name"></h2>
          <p id="card-modal-en" class="detail-meta"></p>
          <p id="card-modal-meta" class="detail-meta"></p>
          <div class="seg" id="card-orient" role="group" aria-label="正逆位">
            <button type="button" data-upright="1">正位</button>
            <button type="button" data-upright="0">逆位</button>
          </div>
          <p class="hint">点牌面看大图</p>
        </div>
      </div>
      <div id="card-modal-body" class="card-modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
    <img id="lightbox-img" alt="" />
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
