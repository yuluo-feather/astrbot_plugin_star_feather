; Static type-check settings for this repo. Kept in the repo root rather than copied into
; a CI YAML: whoever runs mypy reads this file, so there is never a second ruler -- the
; same reason pytest.ini exists for test paths, timeout and markers.
;
; ASCII-only on purpose: mypy parses ini files with the system locale codec (GBK on a
; Chinese Windows box), so a non-ASCII comment here makes `python -m mypy` blow up locally.
;
; Scope today: local. No CI job reads this file yet -- typing `python -m mypy` in the repo
; root is what runs it. If it ever graduates into a job, that job reports without blocking
; (job-level continue-on-error), pins the engine to mypy, and does not also add pyright:
; two engines drift, and fixing one turns the other red.
;
; astrbot.* is outside this repo: explicit imports go through ignore_missing_imports, and
; names bound by `from astrbot.api.all import *` are statically unreachable, so their
; name-defined errors are expected rather than defects. Whether that framework surface
; still exists is checked against a real AstrBot by the contract job
; (tests/test_astrbot_contract.py + the stub list in conftest). Cost, stated plainly: a
; genuine typo in a star-imported name is NOT caught here -- the same hole main.py's
; `# ruff: noqa: F403, F405` already admits.
;
; Silence stops at name-defined: attr-defined stays enabled, so a missing StarTarot
; config field is reported instead of waved through (field table: the annotations on
; tarot_core.StarTarot, kept honest by tests/test_settings.py).
;
; Raising the bar later: clear one domain at a time and tighten that domain; never flip
; --strict repo-wide.
[mypy]
python_version = 3.12
files = .
ignore_missing_imports = True
show_error_codes = True
pretty = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
strict_equality = True

; Two files do `from astrbot.api.all import *`; the cost of that is claimed per file
[mypy-main]
disable_error_code = name-defined

[mypy-tarot_core]
disable_error_code = name-defined
