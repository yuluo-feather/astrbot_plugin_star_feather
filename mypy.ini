; Static type-check settings for this repo. Kept in the repo root rather than copied into
; a CI YAML: whoever runs mypy reads this file, so there is never a second ruler -- the
; same reason pytest.ini exists for test paths, timeout and markers.
;
; ASCII-only on purpose: mypy parses ini files with the system locale codec (GBK on a
; Chinese Windows box), so a non-ASCII comment here makes `python -m mypy` blow up locally.
;
; Scope: local and CI. `.github/workflows/ci.yml` has a blocking `static` job that runs
; `python -m mypy`; it reports as a required check (no continue-on-error). This file stays
; the single source of config -- the job does not duplicate settings, and the repo does not
; also add pyright: two engines drift, and fixing one turns the other red.
;
; astrbot.* is outside this repo: explicit imports go through ignore_missing_imports, so
; framework names are typed as Any. Whether that surface still exists is checked against a
; real AstrBot by the contract job (tests/test_astrbot_contract.py + the stub list in
; conftest) -- static analysis cannot prove it, and the plugin no longer hides names
; behind `from astrbot.api.all import *`.
;
; attr-defined stays enabled, so a missing Settings field is reported instead of
; waved through (defaults and field names: the frozen dataclasses in core/settings.py,
; kept honest by scripts/config_docs.py and tests/test_config.py).
;
; Raising the bar later: clear one domain at a time and tighten that domain; never flip
; --strict repo-wide.
[mypy]
python_version = 3.12
files = .
ignore_missing_imports = True
show_error_codes = True
pretty = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
strict_equality = True

