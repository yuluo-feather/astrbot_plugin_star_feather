  触发：私聊直接说「占卜 问题」就行（带 / 前缀也行）；群聊 @ 机器人，或在 WebUI 设置唤醒词后「唤醒词 占卜 …」也能触发；不 @ 不带唤醒词的裸文本不响应——门槛交给框架，牌灵只管算牌
