# 运行环境要求：Python 3.12+（与 AstrBot 最低要求一致）；AstrBot >= 4.16,<5
name: astrbot_plugin_star_feather
display_name: 星羽塔罗
desc: 星羽塔罗：78张塔罗牌 AI 占卜与深度解读，幻星集素材渲染牌面图
short_desc: 78张塔罗牌 AI 占卜与深度解读，幻星集素材渲染牌面
help: |
  [占卜 问题] 智能匹配牌阵并占卜（情感→恋羽十字，事业→羽镜，默认羽时三刻；经典名 单张问询/圣三角/恋人十字/时间之流 也认）
  [单抽 问题] 快速抽一张（羽签），每次现抽、不按天固定
  [今日牌运 主题] 今天固定的一张牌与解读（别名 /运势、/每日一签）
  [占卜 帮助] 查看使用说明
  [自然语言] 直接说「帮我算一卦」「看看今天的运势」也可触发（可在配置中关闭）
  触发：私聊直接说「占卜 问题」就行（带 / 前缀也行）；群聊 @ 机器人，或在 WebUI 设置唤醒词后「唤醒词 占卜 …」也能触发；群聊里不 @ 不带唤醒词的裸文本不响应——门槛交给框架，牌灵只管算牌
  观测台：插件详情页的「星羽塔罗 · 观测台」需要 AstrBot 4.24.2+；更低版本仅聊天功能可用
version: 0.10.0
author: 羽落
repo: https://github.com/yuluo-feather/astrbot_plugin_star_feather
# 运行环境要求：Python 3.12+（与 AstrBot 最低要求一致）；AstrBot 版本范围在下方 astrbot_version 正式声明
astrbot_version: ">=4.16,<5"
