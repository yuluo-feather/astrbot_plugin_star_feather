# ruff 配置（星羽塔罗开发用，AstrBot 运行不读此文件）
# 显式声明规则集：ruff 0.16 在配置文件存在时会自动启用大默认集（含 S/BLE/RUF 等），
# 与本项目刻意冲突——KV 读写/渲染失败的 try-except-pass 静默降级是设计（宁放行不拦坏），
# 故只保留核心检查 E4/E7/E9/F + import 排序 I。
[lint]
select = ["E4", "E7", "E9", "F", "I"]
# 无 ignore：E402 的旧豁免随第 ⑥ 轮一起退役（那时代码里要先 sys.path 插目录再在模块顶部 import，
# 才不得不豁免）。如今插件根与 tests 都没有模块级路径准备——脚本里若确有需要，
# 把 sys.path 准备放进 __main__ 块或函数内即可，不触发 E402（2026-10-12 实测：清空豁免后全绿）。
